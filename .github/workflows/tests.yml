name: Testy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The newest Xcode on the image; the code must also build with SDKs older than the local one.
      - name: Najnowszy Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: swift test
        run: swift test --disable-sandbox
